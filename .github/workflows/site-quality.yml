name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local HTML links and assets
        run: python scripts/check-site-links.py
      - name: Validate XML sitemap
        run: python scripts/check-sitemap.py
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
